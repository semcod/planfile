name: Planfile GitHub issue reconciliation

on:
  workflow_call:
    inputs:
      planfile-version:
        description: Published Planfile version to install
        required: false
        type: string
        default: "0.1.126"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Planfile
        run: python -m pip install --disable-pip-version-check "planfile==${{ inputs.planfile-version }}"

      - name: Reconcile managed GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          planfile sync github .
          --repo "$GITHUB_REPOSITORY"
          --managed-only
          --direction both
