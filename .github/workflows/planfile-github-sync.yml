# Repository-specific, read-only observation of five qualified terminal records.
# The general bidirectional member template/reusable workflow stays separate.
# Disposable inbound state is never pushed back into the repository or Issues.
name: Planfile GitHub sync
run-name: "Planfile GitHub sync ${{ inputs.observation-id || github.run_id }}"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      observation-id:
        description: Correlation identifier for this read-only canary
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - ".planfile/**"
      - "*.planfile.yaml"
      - "*.planfile.yml"
      - "planfile.yaml"
      - "tickets.planfile.yaml"
      - "project/**"

concurrency:
  group: planfile-github-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  sync:
    uses: ./.github/workflows/planfile-sync-readonly.yml
    with:
      observation-id: ${{ inputs.observation-id || format('scheduled-{0}', github.run_id) }}
    permissions:
      contents: read
      issues: read
