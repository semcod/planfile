name: CI/CD with Auto Bug-Fix Loop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  AUTO_FIX: ${{ vars.AUTO_FIX || 'false' }}
  UPDATE_STRATEGY: ${{ vars.UPDATE_STRATEGY || 'false' }}

jobs:
  ci-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, Node 24
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[api,github] pytest pytest-cov
          pip install llx  # Install llx for AI analysis
      
      - name: Install Ollama (for local LLM)
        if: env.AUTO_FIX == 'true'
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:3b

      - name: Run deterministic test gate
        run: |
          pytest -q \
            --junitxml=test-results.xml \
            --cov=planfile \
            --cov-report=json:coverage.json \
            --cov-report=html
      
      - name: Run CI Auto-Loop
        # The loop may create issues and requires a configured strategy. Keep
        # it opt-in; deterministic tests above are the required PR gate.
        if: env.AUTO_FIX == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          AUTO_FIX_FLAG=""
          if [ "${AUTO_FIX}" = "true" ]; then
            AUTO_FIX_FLAG="--auto-fix"
          fi

          planfile auto loop \
            ./.github/strategy.yaml \
            . \
            --backend github \
            --max-iterations 5 \
            ${AUTO_FIX_FLAG} \
            --output ci-results.json
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            if (fs.existsSync('ci-results.json')) {
              const results = JSON.parse(fs.readFileSync('ci-results.json', 'utf8'));
              
              const comment = `
              ## 🤖 CI/CD Auto-Loop Results
              
              **Status**: ${results.success ? '✅ Success' : '❌ Failed'}
              **Iterations**: ${results.total_iterations}
              **Tickets Created**: ${results.tickets_created.length}
              
              ${results.tickets_created.length > 0 ? `
              ### 📫 Created Tickets
              ${results.tickets_created.map(url => `- [Ticket](${url})`).join('\n')}
              ` : ''}
              
              ${!results.success ? `
              ### ❌ Issues
              Final status: ${results.final_status}
              ` : ''}
              
              ---
              *Generated by SprintStrat CI/CD*
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      
      - name: Update strategy if needed
        if: failure() && env.UPDATE_STRATEGY == 'true'
        run: |
          # Generate updated strategy based on failures
          llx chat . --model balanced \
            --prompt "Update strategy.yaml based on recent test failures and CI results. Output only valid YAML." \
            > strategy-updated.yaml
          
          # Create PR for strategy update
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b strategy-update-${{ github.run_number }}
          git add strategy-updated.yaml
          git commit -m "ci: Update strategy based on CI results"
          git push origin strategy-update-${{ github.run_number }}
          gh pr create --title "Auto-update strategy" --body "Strategy updated based on CI results"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        if: always()
        with:
          name: ci-results
          path: |
            ci-results.json
            test-results.xml
            coverage.json
            htmlcov/
      
      - name: Coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          pip install 'setuptools<81' coverage-badge
          coverage-badge -f -o coverage.svg
      
  notify:
    runs-on: ubuntu-latest
    needs: ci-loop
    if: always()
    
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"CI/CD ${{ needs.ci-loop.result }}: ${{ github.repository }} - ${{ github.sha }}"}' \
            ${{ env.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
